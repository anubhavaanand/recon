[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "recon-patent"
version = "0.2.0"
description = "Terminal-native patent research CLI/TUI tool"
readme = "README.md"
authors = [
    {name = "Anubhav Anand", email = "anubhav@example.com"},
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Utilities",
]
keywords = ["patent", "research", "cli", "tui", "textual"]
requires-python = ">=3.12"
dependencies = [
    "textual>=1.0",
    "httpx>=0.27",
    "Pillow>=10.0",
    "rapidfuzz>=3.0",
    "typer>=0.9",
    "fpdf2>=2.7",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "ddgs>=1.0",
    "cryptography>=41.0",
]

[project.urls]
Homepage = "https://github.com/anubhavanand/recon"
Repository = "https://github.com/anubhavanand/recon"
Documentation = "https://github.com/anubhavanand/recon#readme"
Issues = "https://github.com/anubhavanand/recon/issues"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "psutil>=5.9",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "psutil>=5.9",
]

[tool.setuptools.packages.find]
include = ["recon*", "cli", "tui", "core", "clients", "storage", "tui.widgets"]

[project.scripts]
recon = "cli.main:app"
